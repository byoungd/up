name: Scheduled External Link Check

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify catalog and project entry points
        id: catalog
        run: |
          set -euo pipefail
          failed=0
          mkdir -p lychee
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            if ! curl --fail --location --http1.1 --compressed \
                --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 45 \
                -A 'Mozilla/5.0 (compatible; Life-Level-Guide-Link-Check/1.0)' \
                -o /dev/null "$url"; then
              printf -- '- Failed catalog or project URL: %s\n' "$url" >> lychee/catalog.md
              failed=1
            fi
          done < <({
            grep -rhoE --include='*.md' 'https://(book|movie)\.douban\.com/[^) >]+' docs/threads docs/en/threads || true
            printf '%s\n' https://token.love/ https://ku0.com/
          } | sort -u)
          exit "$failed"
      - name: Guard retired failure URLs
        id: retired
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if grep -REni --include='*.md' 'scholarspace\.manoa\.hawaii\.edu|doi\.org/10\.64152/10125/66973|10\.1076/edre\.7\.1\.403\.3989|web\.archive\.org/web/20160424221725' \
            ATTRIBUTIONS.md docs README.md; then
            echo 'A retired URL from the 193-197 failure series has returned.' >&2
            exit 1
          fi
      - uses: lycheeverse/lychee-action@v2.9.0
        if: ${{ !cancelled() }}
        with:
          args: >-
            --no-progress
            --accept 200..=399,403,429
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --max-redirects 20
            --user-agent "Mozilla/5.0 (compatible; Life-Level-Guide-Link-Check/1.0)"
            --exclude-path node_modules
            --exclude "^(file://|/|error:)"
            --exclude "^https://(book|movie)\.douban\.com/"
            --exclude "^https://(token\.love|ku0\.com)/"
            --exclude "https://localhost"
            "ATTRIBUTIONS.md"
            "docs/README.md"
            "docs/en/README.md"
            "docs/projects.md"
            "docs/en/projects.md"
            "docs/reference/**/*.md"
            "docs/en/reference/**/*.md"
            "docs/templates/**/*.md"
            "docs/en/templates/**/*.md"
            "docs/threads/**/*.md"
            "docs/en/threads/**/*.md"
          fail: true
      - name: Close stale external-link failure issues
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue list --repo "${{ github.repository }}" --state open --label automation --limit 100 --json number,title \
            --jq '.[] | select(.title == "Scheduled external-link check failed") | .number' \
            | while IFS= read -r issue; do
                [ -n "$issue" ] || continue
                gh issue close "$issue" --repo "${{ github.repository }}" \
                  --comment "The latest scheduled link check passed, so this stale automation issue is now closed."
              done
      - name: Prepare a report for every failure path
        if: failure()
        env:
          RETIRED_RESULT: ${{ steps.retired.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p lychee
          touch lychee/out.md
          if [[ -f lychee/catalog.md ]]; then
            printf '\n## Catalog and project failures\n\n' >> lychee/out.md
            cat lychee/catalog.md >> lychee/out.md
          fi
          if [[ "$RETIRED_RESULT" == failure ]]; then
            printf '\nA retired URL has returned. See the workflow log for its location.\n' >> lychee/out.md
          fi
          printf '\n[Inspect the failed workflow run](%s).\n' "$RUN_URL" >> lychee/out.md
      - uses: peter-evans/create-issue-from-file@v6
        if: failure()
        with:
          title: "Scheduled external-link check failed"
          content-filepath: ./lychee/out.md
          labels: broken-link,automation
