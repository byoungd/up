<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Life Level-up Guide book sharing cover</title>
  <desc id="description">By Han Xiankai. Five rising stages represent input, life, tools, practice, and action.</desc>
  <rect width="1200" height="630" fill="#f5f7f3"/>
  <rect width="14" height="630" fill="#176f5b"/>
  <path d="M58 94H650M58 570H650" stroke="#cfd7d1" stroke-width="1"/>
