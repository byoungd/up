    <text x="70" y="196" fill="#1d2926" font-size="70" font-weight="800">LIFE LEVEL-UP</text>
    <text x="70" y="270" fill="#1d2926" font-size="70" font-weight="800">GUIDE</text>
    <text x="72" y="335" fill="#485652" font-size="25">Begin with language. Move through life, AI, practice,</text>
    <text x="72" y="374" fill="#485652" font-size="25">and the work of changing over time.</text>
    <text x="72" y="446" fill="#1d2926" font-size="20" font-weight="700">Question → Learn → Work with AI → Deliver → Review → Transfer</text>
    <text x="72" y="535" fill="#1d2926" font-size="24" font-weight="700">Han Xiankai</text>
    <text x="222" y="535" fill="#6b7773" font-size="19">pen name: Li Pu</text>
    <text x="72" y="605" fill="#6b7773" font-size="17">byoungd.github.io/up/en</text>
  </g>

